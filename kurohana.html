
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="A personal knowledge hub for programming, cybersecurity, Japanese, creative writing, music and sports." />
  <title>Kurohana — Personal Knowledge Hub</title>

  <style>
    /* =========================================================
       01. DESIGN TOKENS
    ========================================================= */
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --surface: #11141c;
      --surface-2: #171b25;
      --surface-3: #202533;
      --text: #f3f5fb;
      --muted: #9ba4b8;
      --line: rgba(255,255,255,.09);
      --accent: #b6a0ff;
      --accent-2: #78e4c5;
      --danger: #ff8291;
      --warning: #f3cb7b;
      --radius: 20px;
      --radius-sm: 12px;
      --sidebar-width: 248px;
      --content-width: 1180px;
      --shadow: 0 18px 55px rgba(0,0,0,.22);
      --transition: 180ms ease;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 75% -10%, rgba(126,104,219,.12), transparent 38%),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible,
    textarea:focus-visible, select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 3px;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }
    ::selection { background: var(--accent); color: #100e18; }

    .app-shell { min-height: 100vh; }

    /* =========================================================
       02. SIDEBAR AND NAVIGATION
    ========================================================= */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      width: var(--sidebar-width);
      padding: 28px 18px;
      background: rgba(13,15,22,.96);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(20px);
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 30px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: #171222;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-size: 21px;
      font-weight: 900;
    }

    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: 2px; }
    .brand-caption { display: block; color: var(--muted); font-size: 10px; letter-spacing: 1.4px; }

    .nav-label {
      margin: 15px 10px 8px;
      color: #697286;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .nav-list { display: grid; gap: 5px; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      transition: var(--transition);
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--line);
    }

    .nav-icon { width: 24px; text-align: center; font-size: 17px; }

    .sidebar-bottom {
      margin-top: auto;
      padding: 20px 10px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 12px rgba(120,228,197,.5);
    }

    .mobile-topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 25;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(11,13,18,.93);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    /* =========================================================
       03. MAIN LAYOUT
    ========================================================= */
    .main {
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      padding: 30px clamp(18px, 4vw, 54px) 60px;
    }

    .main-inner { width: 100%; max-width: var(--content-width); margin: auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 36px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .breadcrumbs button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
    }

    .breadcrumbs button:hover { color: var(--accent-2); }
    .crumb-separator { opacity: .45; }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .search-wrap { position: relative; width: min(310px, 34vw); }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: var(--surface);
      transition: border var(--transition);
    }

    .search-input:focus { border-color: rgba(182,160,255,.6); }
    .search-symbol { position: absolute; top: 8px; left: 13px; color: var(--muted); }

    .icon-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }

    .icon-button:hover { border-color: var(--accent); }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 16px; font-size: clamp(32px, 4vw, 52px); line-height: 1.12; letter-spacing: -1.8px; }
    h2 { margin-bottom: 8px; font-size: clamp(21px, 2vw, 28px); letter-spacing: -.5px; }
    h3 { margin-bottom: 8px; font-size: 17px; }
    p { color: var(--muted); }
    .lead { max-width: 720px; font-size: 16px; line-height: 1.85; }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 40px 0 18px;
    }

    .section-heading p { margin: 0; font-size: 13px; }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(26px, 5vw, 58px);
      border: 1px solid rgba(182,160,255,.19);
      border-radius: 28px;
      background:
        radial-gradient(circle at 90% 20%, rgba(182,160,255,.19), transparent 30%),
        linear-gradient(120deg, #171622, #121820 75%);
      box-shadow: var(--shadow);
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      right: 6%;
      bottom: -100px;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(182,160,255,.15);
      border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(182,160,255,.025),
                  0 0 0 70px rgba(182,160,255,.02);
      content: "";
    }

    .hero h1 { max-width: 680px; }
    .hero h1 span { color: var(--accent); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 43px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      transition: transform var(--transition), border var(--transition), background var(--transition);
    }

    .button:hover { transform: translateY(-2px); border-color: var(--accent); }
    .button.primary { border-color: transparent; background: var(--accent); color: #171222; }
    .button.primary:hover { background: #c7b7ff; }
    .button.success { color: var(--accent-2); }
    .button.danger { color: var(--danger); }
    .button.small { min-height: 34px; padding: 6px 11px; font-size: 12px; }

    .grid { display: grid; gap: 16px; }
    .category-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .topic-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card {
      min-width: 0;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(23,27,37,.94), rgba(16,19,27,.96));
      transition: transform var(--transition), border-color var(--transition), background var(--transition);
    }

    .card:hover { border-color: rgba(182,160,255,.4); }
    .clickable-card { cursor: pointer; }
    .clickable-card:hover { transform: translateY(-4px); background: var(--surface-2); }
    .card:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }

    .category-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      font-size: 23px;
    }

    .card p { margin-bottom: 0; font-size: 13px; line-height: 1.75; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 20px; color: var(--muted); font-size: 11px; }
    .card-arrow { color: var(--accent-2); font-size: 18px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 100px;
      color: #c5ccdc;
      font-size: 10px;
      letter-spacing: .2px;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .content-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(250px, .8fr); gap: 18px; }
    .stack { display: grid; align-content: start; gap: 16px; }
    .muted-small { color: var(--muted); font-size: 12px; }
    .divider { height: 1px; margin: 20px 0; background: var(--line); }
    .list-clean { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .list-clean li { position: relative; padding-left: 20px; color: var(--muted); font-size: 14px; }
    .list-clean li::before { position: absolute; left: 0; color: var(--accent-2); content: "↗"; }

    .article-content { max-width: 850px; }
    .article-content h2 { margin-top: 28px; }
    .article-content p, .article-content li { font-size: 14px; line-height: 1.9; }
    .article-content ul { padding-left: 22px; color: var(--muted); }

    .code-sample {
      overflow-x: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #090b10;
      color: #d8d5ff;
      font: 13px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre;
    }

    .callout {
      margin: 20px 0;
      padding: 16px 18px;
      border-left: 3px solid var(--accent-2);
      border-radius: 0 12px 12px 0;
      background: rgba(120,228,197,.06);
      color: #cbd6d7;
      font-size: 13px;
    }

    .field { display: grid; gap: 7px; margin: 15px 0; }
    .field label { color: #c6ccda; font-size: 12px; font-weight: 700; }
    .field input, .field textarea, .field select,
    .control-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #0d1017;
      color: var(--text);
    }

    .field textarea { min-height: 110px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus,
    .control-input:focus { border-color: var(--accent); }

    .quiz-options { display: grid; gap: 9px; margin: 18px 0; }
    .quiz-option {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-2);
      color: var(--text);
      text-align: left;
    }
    .quiz-option:hover { border-color: var(--accent); }
    .quiz-option.correct { border-color: var(--accent-2); background: rgba(120,228,197,.09); }
    .quiz-option.incorrect { border-color: var(--danger); background: rgba(255,130,145,.08); }
    .feedback { min-height: 24px; margin: 12px 0; color: var(--accent-2); font-size: 13px; }

    .flashcard {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 25px;
      border: 1px solid rgba(182,160,255,.24);
      border-radius: 20px;
      background: radial-gradient(circle at 50% 0, rgba(182,160,255,.12), transparent 65%), var(--surface-2);
      text-align: center;
    }
    .flashcard-main { margin-bottom: 8px; font-size: clamp(30px, 5vw, 48px); font-weight: 800; }
    .flashcard-sub { color: var(--muted); font-size: 14px; }

    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: var(--surface-3); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 240ms ease; }

    .check-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); color: #d9deea; font-size: 13px; }
    .check-row input { accent-color: var(--accent-2); width: 16px; height: 16px; }

    .log-table { width: 100%; border-collapse: collapse; font: 12px/1.7 ui-monospace, monospace; }
    .log-table th, .log-table td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .log-table th { color: var(--muted); font-weight: 700; }
    .log-table td { color: #d1d7e5; }
    .log-table-wrap { overflow-x: auto; }

    .empty-state { padding: 35px 15px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      max-width: min(360px, calc(100vw - 32px));
      padding: 13px 17px;
      border: 1px solid rgba(120,228,197,.3);
      border-radius: 12px;
      background: #151d22;
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 180ms ease;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }

    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 60px; padding-top: 22px; border-top: 1px solid var(--line); color: #737d91; font-size: 11px; }

    .hidden { display: none !important; }

    /* =========================================================
       04. RESPONSIVE DESIGN
    ========================================================= */
    @media (max-width: 1100px) {
      .category-grid, .topic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .sidebar { transform: translateX(-100%); transition: transform 220ms ease; box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .mobile-topbar { display: flex; }
      .main { margin-left: 0; padding: 22px 16px 40px; }
      .topbar { align-items: flex-start; flex-direction: column; margin-bottom: 25px; }
      .topbar-right { width: 100%; }
      .search-wrap { width: 100%; }
      .hero { padding: 28px 22px; border-radius: 22px; }
      .category-grid, .topic-grid, .stats-grid { grid-template-columns: 1fr; }
      .section-heading { align-items: flex-start; flex-direction: column; margin-top: 30px; }
      .panel { padding: 18px; }
      .footer { margin-top: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    const plotComplications = ["the timeline contradicts the first report", "an ally refuses to explain their actions", "the key evidence has two plausible meanings", "the deadline arrives earlier than expected", "a minor detail changes the entire theory", "the main character must choose between trust and certainty"];

    /* =========================================================
       02. APP STATE AND UTILITIES
    ========================================================= */
    const appContent = document.getElementById("app-content");
    const breadcrumbs = document.getElementById("breadcrumbs");
    const searchInput = document.getElementById("global-search");
    const sidebar = document.getElementById("sidebar");
    const toastElement = document.getElementById("toast");

    const state = {
      route: { type: "home", id: "" },
      search: "",
      flashIndex: 0,
      flashRevealed: false,
      kanjiIndex: 0,
      drumHits: 0,
      tempoTaps: [],
      scoreA: 0,
      scoreB: 0,
      quizIndex: 0,
      quizScore: 0,
      quizAnswered: false,
      quizTopic: "",
      logsFilter: "ALL",
      logsSearch: ""
    };

    const storage = {
      read(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : JSON.parse(value);
        } catch {
          return fallback;
        }
      },
      write(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch {
          showToast("Browser storage is unavailable in this session.");
          return false;
        }
      }
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function findCategory(id) {
      return categories.find(category => category.id === id);
    }

    function findTopic(id) {
      for (const category of categories) {
        const topic = category.topics.find(item => item.id === id);
        if (topic) return { ...topic, categoryId: category.id, categoryTitle: category.title };
      }
      return null;
    }

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastElement.classList.remove("visible"), 2600);
    }

    function setRoute(type, id = "", options = {}) {
      state.route = { type, id };
      if (!options.keepSearch) searchInput.value = "";
      state.search = "";
      sidebar.classList.remove("open");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });

      const hash = type === "home" ? "home" : `${type}/${id}`;
      if (window.location.hash.slice(1) !== hash) {
        history.pushState({ type, id }, "", `#${hash}`);
      }
    }

    function routeFromHash() {
      const value = decodeURIComponent(window.location.hash.slice(1) || "home");
      if (value === "home") {
        state.route = { type: "home", id: "" };
      } else {
        const [type, ...rest] = value.split("/");
        const id = rest.join("/");
        if (type === "category" && findCategory(id)) state.route = { type, id };
        else if (type === "topic" && findTopic(id)) state.route = { type, id };
        else if (type === "page" && ["practice", "about"].includes(id)) state.route = { type, id };
        else state.route = { type: "home", id: "" };
      }
      render();
    }

    function setBreadcrumbs(items) {
      breadcrumbs.innerHTML = items.map((item, index) => {
        if (index === items.length - 1) {
          return `<span aria-current="page">${escapeHTML(item.label)}</span>`;
        }
        return `<button data-action="${escapeHTML(item.action || "go-home")}" ${item.id ? `data-id="${escapeHTML(item.id)}"` : ""}>${escapeHTML(item.label)}</button><span class="crumb-separator">/</span>`;
      }).join("");
    }

    function topicCard(topic, categoryId) {
      return `
        <article class="card clickable-card" tabindex="0" role="link"
          data-action="go-topic" data-id="${escapeHTML(topic.id)}" aria-label="Open ${escapeHTML(topic.title)}">
          <div class="category-icon">${topic.icon}</div>
          <h3>${escapeHTML(topic.title)}</h3>
          <p>${escapeHTML(topic.description)}</p>
          <div class="tag-row">${topic.tags.map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
          <div class="card-meta"><span>${escapeHTML(topic.level)}</span><span class="card-arrow">↗</span></div>
        </article>`;
    }

    function categoryCard(category) {
      return `
        <article class="card clickable-card" tabindex="0" role="link"
          data-action="go-category" data-id="${escapeHTML(category.id)}" aria-label="Open ${escapeHTML(category.title)}">
          <div class="category-icon">${category.icon}</div>
          <h3>${escapeHTML(category.title)}</h3>
          <p>${escapeHTML(category.description)}</p>
          <div class="tag-row">${category.tags.map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
          <div class="card-meta"><span>${category.topics.length} learning modules</span><span class="card-arrow">↗</span></div>

    function renderHome() {
      setBreadcrumbs([{ label: "Workspace" }, { label: "Overview" }]);

      const totalTopics = categories.reduce((total, category) => total + category.topics.length, 0);
      const done = storage.read("kurohana.completed", []);
      const progress = totalTopics ? Math.round(done.length / totalTopics * 100) : 0;

      appContent.innerHTML = `
        <section class="hero">

          <div class="hero-actions">
            <button class="button primary" data-action="go-category" data-id="programming">Explore learning paths ↗</button>

        <div class="section-heading">
          <div><p class="eyebrow">YOUR DASHBOARD</p><h2>A little progress, every day.</h2></div>
          <p>${totalTopics} modules across ${categories.length} interests</p>

        <div class="grid stats-grid">

          <div class="card"><p class="eyebrow">LEARNING MODULES</p><h2>${totalTopics}</h2><p>Notes, activities and practical exercises.</p></div>
          <div class="card"><p class="eyebrow">TRACKED PROGRESS</p><h2>${progress}%</h2><div class="progress-track" style="margin-top:12px"><div class="progress-fill" style="width:${progress}%"></div></div><p style="margin-top:10px">${done.length} modules marked complete.</p></div>

        </div>`;

    function renderCategory(id) {

      if (!category) return renderHome();

      setBreadcrumbs([
        { label: "Workspace", action: "go-home" },

        <section class="hero">

        state.quizScore = 0;

        return `

    function renderSearch() {
      const query = state.search.trim().toLowerCase();
      if (!query) return renderHome();

      setBreadcrumbs([{ label: "Workspace", action: "go-home" }, { label: "Search" }]);

      const matchedCategories = categories.filter(category =>
        `${category.title} ${category.description} ${category.tags.join(" ")}`.toLowerCase().includes(query)
      );
      const matchedTopics = categories.flatMap(category =>
        category.topics
          .filter(topic => `${topic.title} ${topic.description} ${topic.tags.join(" ")} ${category.title}`.toLowerCase().includes(query))
          .map(topic => ({ ...topic, categoryId: category.id }))
      );

      appContent.innerHTML = `
        <p class="eyebrow">LIBRARY SEARCH</p>
        <h1 style="font-size:38px">Results for “${escapeHTML(state.search)}”</h1>
        <p class="lead">Search across categories, topics, descriptions and tags.</p>
        ${matchedCategories.length ? `<div class="section-heading"><h2>Categories</h2></div><div class="grid category-grid">${matchedCategories.map(categoryCard).join("")}</div>` : ""}
        ${matchedTopics.length ? `<div class="section-heading"><h2>Topics</h2></div><div class="grid topic-grid">${matchedTopics.map(topic => topicCard(topic, topic.categoryId)).join("")}</div>` : ""}
        ${!matchedCategories.length && !matchedTopics.length ? `<div class="empty-state"><h2>No results found</h2><p>Try another keyword, such as Python, JLPT, mystery, rhythm or badminton.</p></div>` : ""}`;
    }

    function renderTopic(id) {
      const topic = findTopic(id);
      if (!topic) return renderHome();

      const category = findCategory(topic.categoryId);
      setBreadcrumbs([
        { label: "Workspace", action: "go-home" },
        { label: category.title, action: "go-category", id: category.id },
        { label: topic.title }
      ]);

      let body = "";
      switch (topic.type) {
        case "quiz": body = renderQuiz(topic); break;
        case "flashcards": body = renderFlashcards(topic); break;
        case "kanji": body = renderKanji(); break;
        case "projects": body = renderProjects(); break;
        case "case": body = renderCase(); break;
        case "logs": body = renderLogs(); break;
        case "character": body = renderCharacterMaker(); break;
        case "generator": body = renderGenerator(); break;
        case "prompts": body = renderPrompts(); break;
        case "notes": body = renderNotes(topic); break;
        case "planner": body = renderPlanner(topic); break;
        case "drums": body = renderDrums(); break;
        case "tempo": body = renderTempo(); break;
        case "scoreboard": body = renderScoreboard(); break;
        default: body = renderArticle(topic, category);
      }

      appContent.innerHTML = `
        <div class="section-heading" style="margin-top:0">
          <div><p class="eyebrow">${escapeHTML(category.title.toUpperCase())} / MODULE</p><h2>${escapeHTML(topic.title)}</h2></div>
          <button class="button small" data-action="go-category" data-id="${escapeHTML(category.id)}">← All ${escapeHTML(category.title)}</button>
        </div>
        ${body}`;
    }

    function render() {
      document.querySelectorAll(".nav-link").forEach(link => {
        link.classList.toggle("active",
          (state.route.type === "home" && link.dataset.action === "go-home") ||
          (state.route.type === "category" && link.dataset.id === state.route.id) ||
          (state.route.type === "page" && link.dataset.id === state.route.id)
        );
      });

      if (state.search.trim()) return renderSearch();

      switch (state.route.type) {
        case "category": return renderCategory(state.route.id);
        case "topic": return renderTopic(state.route.id);
        case "page":
          if (state.route.id === "practice") return renderPracticePage();
          if (state.route.id === "about") return renderAbout();
          return renderHome();
        default: return renderHome();
      }
    }

    /* =========================================================
       03. INTERACTIONS
       One delegated listener handles dynamically rendered UI.
    ========================================================= */

    appContent.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;

      const { action, id } = button.dataset;

      switch (action) {
        case "go-home":
          setRoute("home");
          break;

        case "go-category":
          setRoute("category", id);
          break;

        case "go-topic":
          setRoute("topic", id);
          break;

        case "go-page":
          setRoute("page", id);
          break;

        case "toggle-complete": {
          const completed = storage.read("kurohana.completed", []);
          const next = completed.includes(id)
            ? completed.filter(item => item !== id)
            : [...completed, id];
          storage.write("kurohana.completed", next);
          showToast(next.includes(id) ? "Module marked complete ✓" : "Module marked incomplete.");
          render();
          break;
        }

        case "restart-quiz":
          state.quizTopic = "";
          state.quizIndex = 0;
          state.quizScore = 0;
          state.quizAnswered = false;
          render();
          break;

        case "answer-quiz": {
          if (state.quizAnswered) break;
          const topic = findTopic(state.route.id);
          const bank = quizBank[topic.quiz];
          const question = bank[state.quizIndex];
          const answer = Number(button.dataset.index);
          state.quizAnswered = true;
          if (answer === question.answer) state.quizScore++;
          render();
          const buttons = appContent.querySelectorAll(".quiz-option");
          buttons.forEach((option, index) => {
            option.disabled = true;
            if (index === question.answer) option.classList.add("correct");
            if (index === answer && answer !== question.answer) option.classList.add("incorrect");
          });
          const feedback = appContent.querySelector("#quiz-feedback");
          if (feedback) feedback.textContent = answer === question.answer ? "Correct — nice work!" : "Not quite. Review the explanation below.";
          break;
        }

        case "next-quiz":
          state.quizIndex++;
          state.quizAnswered = false;
          render();
          break;

        case "reveal-flashcard":
          state.flashRevealed = !state.flashRevealed;
          render();
          break;

        case "flashcard-next":
          state.flashIndex = (state.flashIndex + 1) % flashcards.length;
          state.flashRevealed = false;
          render();
          break;

        case "flashcard-prev":
          state.flashIndex = (state.flashIndex - 1 + flashcards.length) % flashcards.length;
          state.flashRevealed = false;
          render();
          break;

        case "kanji-next":
          state.kanjiIndex = (state.kanjiIndex + 1) % kanjiCards.length;
          render();
          break;

        case "reveal-case":
          appContent.querySelector("#case-evidence")?.classList.remove("hidden");
          button.classList.add("hidden");
          break;

        case "save-project": {
          const project = projectIdeas[Number(button.dataset.index)];
          const saved = storage.read("kurohana.savedProjects", []);
          if (saved.some(item => item.title === project.title)) {
            showToast("That project is already saved.");
          } else {
            storage.write("kurohana.savedProjects", [...saved, project]);
            showToast("Project idea saved ✓");
          }
          break;
        }

        case "generate-plot": {
          const setting = plotSettings[Math.floor(Math.random() * plotSettings.length)];
          const conflict = plotConflicts[Math.floor(Math.random() * plotConflicts.length)];
          const complication = plotComplications[Math.floor(Math.random() * plotComplications.length)];
          const output = appContent.querySelector("#plot-output");
          if (output) {
            output.dataset.plot = `In ${setting}, a story begins with ${conflict}. Then ${complication}.`;
            output.textContent = output.dataset.plot;
          }
          break;
        }

        case "save-plot": {
          const plot = appContent.querySelector("#plot-output")?.dataset.plot;
          if (!plot) { showToast("Generate an idea first."); break; }
          const saved = storage.read("kurohana.savedPrompts", []);
          storage.write("kurohana.savedPrompts", [...saved, plot]);
          showToast("Story idea saved ✓");
          break;
        }

        case "random-prompt": {
          const output = appContent.querySelector("#prompt-output");
          if (output) {
            output.textContent = promptDeck[Math.floor(Math.random() * promptDeck.length)];
            output.dataset.prompt = output.textContent;
          }
          break;
        }

        case "save-prompt": {
          const prompt = appContent.querySelector("#prompt-output")?.textContent;
          if (!prompt) break;
          const saved = storage.read("kurohana.savedPrompts", []);
          storage.write("kurohana.savedPrompts", [...saved, prompt]);
          showToast("Writing prompt saved ✓");
          break;
        }

        case "drum-hit":
          state.drumHits++;
          appContent.querySelector("#drum-count").textContent = state.drumHits;
          break;

        case "drum-reset":
          state.drumHits = 0;
          appContent.querySelector("#drum-count").textContent = "0";
          break;

        case "tempo-tap": {
          const now = Date.now();
          state.tempoTaps = state.tempoTaps.filter(time => now - time < 4000);
          state.tempoTaps.push(now);
          if (state.tempoTaps.length > 8) state.tempoTaps.shift();
          const bpm = state.tempoTaps.length >= 2
            ? Math.round(60000 / ((state.tempoTaps[state.tempoTaps.length - 1] - state.tempoTaps[0]) / (state.tempoTaps.length - 1)))
            : null;
          appContent.querySelector("#tempo-bpm").textContent = bpm && bpm > 0 && bpm < 300 ? bpm : "—";
          appContent.querySelector("#tempo-tap-count").textContent = `${state.tempoTaps.length} taps recorded`;
          break;
        }

        case "tempo-reset":
          state.tempoTaps = [];
          appContent.querySelector("#tempo-bpm").textContent = "—";
          appContent.querySelector("#tempo-tap-count").textContent = "0 taps recorded";
          break;

        case "score-add":
        case "score-sub": {
          const side = button.dataset.side;
          const delta = action === "score-add" ? 1 : -1;
          const key = side === "A" ? "scoreA" : "scoreB";
          state[key] = Math.max(0, state[key] + delta);
          appContent.querySelector("#score-a").textContent = state.scoreA;
          appContent.querySelector("#score-b").textContent = state.scoreB;
          updateScoreResult();
          break;
        }

        case "score-reset":
          state.scoreA = 0;
          state.scoreB = 0;
          appContent.querySelector("#score-a").textContent = "0";
          appContent.querySelector("#score-b").textContent = "0";
          updateScoreResult();
          break;

        case "reset-planner": {
          storage.write(`kurohana.planner.${id}`, []);
          render();
          break;
        }

        case "save-notes": {
          const key = `kurohana.notes.${id}`;
          const title = appContent.querySelector("#notes-title")?.value || "";
          const body = appContent.querySelector("#notes-body")?.value || "";
          storage.write(`${key}.title`, title);
          storage.write(key, body);
          showToast("Notes saved in this browser ✓");
          break;
        }

        case "clear-notes": {
          const key = `kurohana.notes.${id}`;
          storage.write(key, "");
          storage.write(`${key}.title`, "");
          render();
          showToast("Notes cleared.");
          break;
        }

        case "toggle-menu":
          sidebar.classList.toggle("open");
          break;
      }
    });

    function updateScoreResult() {
      const result = appContent.querySelector("#score-result");
      if (!result) return;
      if (state.scoreA === state.scoreB) result.textContent = "The score is level.";
      else result.textContent = state.scoreA > state.scoreB ? "Player / Team A is ahead." : "Player / Team B is ahead.";
    }

    appContent.addEventListener("keydown", event => {
      const card = event.target.closest(".clickable-card");
      if (card && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        card.click();
      }
    });

    appContent.addEventListener("change", event => {
      const completionId = event.target.dataset.completionId;
      if (completionId) {
        const completed = storage.read("kurohana.completed", []);
        const next = event.target.checked
          ? [...new Set([...completed, completionId])]
          : completed.filter(item => item !== completionId);
        storage.write("kurohana.completed", next);
        renderPracticePage();
        return;
      }

      const plannerId = event.target.dataset.plannerId;
      if (plannerId !== undefined) {
        const topic = findTopic(state.route.id);
        const key = `kurohana.planner.${topic.id}`;
        const checked = [...appContent.querySelectorAll("[data-planner-id]:checked")]
          .map(input => Number(input.dataset.plannerId));
        storage.write(key, checked);
        const total = appContent.querySelectorAll("[data-planner-id]").length;
        const progress = appContent.querySelector("#planner-progress");
        const bar = appContent.querySelector("#planner-bar");
        if (progress) progress.textContent = `${checked.length} of ${total} tasks complete.`;
        if (bar) bar.style.width = `${checked.length / total * 100}%`;
        return;
      }

      if (event.target.id === "log-filter") {
        state.logsFilter = event.target.value;
        const searchValue = appContent.querySelector("#log-search")?.value || "";
        state.logsSearch = searchValue;
        renderTopic("log-lab");
        return;
      }
    });

    appContent.addEventListener("input", event => {
      if (event.target.id === "log-search") {
        state.logsSearch = event.target.value;
        const cursor = event.target.selectionStart;
        renderTopic("log-lab");
        const input = appContent.querySelector("#log-search");
        input?.focus();
        if (input && cursor !== null) input.setSelectionRange(cursor, cursor);
      }
    });

    appContent.addEventListener("submit", event => {
      if (event.target.id !== "character-form") return;
      event.preventDefault();
      const data = new FormData(event.target);
      const profile = {
        name: String(data.get("name") || "").trim(),
        role: String(data.get("role") || ""),
        goal: String(data.get("goal") || "").trim(),
        flaw: String(data.get("flaw") || "").trim(),
        secret: String(data.get("secret") || "").trim()
      };

      const output = appContent.querySelector("#character-output");
      if (!profile.name || !profile.goal) {
        output.textContent = "Add a name and a main goal first.";
        return;
      }

      output.innerHTML = `
        <span class="tag">${escapeHTML(profile.role)}</span>
        <h2 style="margin-top:15px">${escapeHTML(profile.name)}</h2>
        <h3>Goal</h3><p>${escapeHTML(profile.goal)}</p>
        <h3>Flaw</h3><p>${escapeHTML(profile.flaw || "Not defined yet.")}</p>
        <h3>Secret / contradiction</h3><p>${escapeHTML(profile.secret || "Still to be discovered.")}</p>
        <div class="callout">Story question: what choice would force this character to confront their flaw?</div>
        <button class="button small" id="save-character">Save profile</button>`;

      document.getElementById("save-character")?.addEventListener("click", () => {
        const saved = storage.read("kurohana.characters", []);
        storage.write("kurohana.characters", [...saved, profile]);
        showToast("Character profile saved ✓");
      });
    });

    searchInput.addEventListener("input", event => {
      state.search = event.target.value;
      render();
    });

    document.addEventListener("click", event => {
      const menuButton = event.target.closest('[data-action="toggle-menu"]');
      if (menuButton) sidebar.classList.toggle("open");

      const homeButton = event.target.closest('[data-action="go-home"]');
      if (homeButton && !homeButton.closest("#app-content")) setRoute("home");

      const categoryButton = event.target.closest('[data-action="go-category"]');
      if (categoryButton && !categoryButton.closest("#app-content")) setRoute("category", categoryButton.dataset.id);

      const pageButton = event.target.closest('[data-action="go-page"]');
      if (pageButton && !pageButton.closest("#app-content")) setRoute("page", pageButton.dataset.id);
    });

    window.addEventListener("popstate", routeFromHash);
    window.addEventListener("hashchange", () => {
      const target = window.location.hash.slice(1);
      const expected = state.route.type === "home" ? "home" : `${state.route.type}/${state.route.id}`;
      if (target !== expected) routeFromHash();
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    // Start from the URL route so browser back/forward and shared hashes work.
    routeFromHash();
  </script>
</body>
</html>
